# Local stack stub. Services are declared but not yet wired end-to-end.
services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --kafka-addr PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"

  airflow:
    image: apache/airflow:2.9.3
    depends_on:
      - redpanda
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: standalone

  streamlit:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./dashboards:/app
      - ./data:/app/data
    command: >
      bash -c "pip install streamlit duckdb && streamlit run app.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
