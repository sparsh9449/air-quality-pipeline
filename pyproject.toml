[project]
name = "air-quality-pipeline"
version = "0.1.0"
description = "Real-time air quality pipeline using Sensor.Community data"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
